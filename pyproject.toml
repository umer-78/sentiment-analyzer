[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analyzer"
version = "1.0.0"
description = "Naive Bayes sentiment classifier written from scratch, with a review-aware tokeniser, per-prediction explanations and a scikit-learn benchmark."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8"]

[project.scripts]
sentiment = "sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit rule set, rather than whatever the newest ruff turns on by default:
# an unpinned linter with implicit rules means CI breaks on someone else's release
# schedule, not on a change to this code.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
